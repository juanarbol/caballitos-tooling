<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICARO/SIGLO a CSV de Shopify</title>
  </head>
  <body class="min-h-screen text-slate-800">
    <div class="mx-auto max-w-4xl px-6 py-12">
      <div class="rounded-2xl border border-slate-200 bg-white/90 p-8 shadow-xl shadow-slate-200/60 backdrop-blur">
        <div class="mb-8">
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-indigo-600">PoC</p>
          <h1 class="mt-3 text-3xl font-bold text-slate-900">XLSX de Icaro|Siglo → CSV de Shopify</h1>
          <p class="mt-2 text-slate-600">
            Sube el catálogo y descarga el CSV convertido para Shopify sin escribir en el disco.
          </p>
        </div>

        <div class="flex flex-col gap-5 md:flex-row md:items-end">
          <label class="block w-full md:max-w-md">
            <span class="mb-2 block text-sm font-medium text-slate-700">Catálogo</span>
            <select
              id="catalogSelect"
              class="block w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            >
              <option value="icaro">Icaro</option>
              <option value="siglo">Siglo</option>
            </select>
          </label>

          <label class="block w-full md:max-w-md">
            <span class="mb-2 block text-sm font-medium text-slate-700">Omitir si cantidad es menor que</span>
            <input
              id="skipThresholdInput"
              type="number"
              min="0"
              step="1"
              value="1"
              placeholder="Ej: 5"
              class="block w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            />
          </label>

          <label class="block w-full md:max-w-md">
            <span class="mb-2 block text-sm font-medium text-slate-700">Archivo Excel</span>
            <input
              id="fileInput"
              type="file"
              accept=".xlsx,.xls"
              class="block w-full cursor-pointer rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-sm text-slate-700 file:mr-4 file:rounded-lg file:border-0 file:bg-indigo-600 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-indigo-500"
            />
          </label>

          <button
            id="convertBtn"
            type="button"
            class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-slate-400"
          >
            Convertir y descargar
          </button>
        </div>

        <div class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700">
          <div class="flex items-center justify-between gap-4">
            <span class="font-medium">Estado</span>
            <span id="statusBadge" class="rounded-full bg-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-700">Esperando</span>
          </div>
          <p id="statusText" class="mt-3 text-slate-600">Elige un archivo Excel para comenzar.</p>
        </div>

        <div class="mt-8 grid gap-4 md:grid-cols-3">
          <div class="rounded-xl border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Productos</p>
            <p id="productCount" class="mt-3 text-2xl font-bold text-slate-900">0</p>
          </div>
          <div class="rounded-xl border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Salida</p>
            <p class="mt-3 text-lg font-bold text-slate-900">CSV</p>
          </div>
          <div class="rounded-xl border border-slate-200 bg-white p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Modo</p>
            <p class="mt-3 text-lg font-bold text-slate-900">Descarga en navegador</p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
